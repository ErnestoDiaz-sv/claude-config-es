name: Check

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run repository checks
        env:
          REQUIRE_SHELLCHECK: "1"
        run: ./scripts/check.sh
