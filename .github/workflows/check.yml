name: Check

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository checks
        env:
          REQUIRE_SHELLCHECK: "1"
        run: ./scripts/check.sh
